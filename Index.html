<html lang="en">
<head>

<title>Bhajan Baithak</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --header-bg: #C8793D;
    --nav-bg: #3D2B1F;
    --nav-btn-border: #D4943A;
    --nav-btn-text: #D4943A;
    --nav-btn-hover-bg: #D4943A;
    --nav-btn-hover-text: #3D2B1F;
    --content-bg: #FDF5F0;
    --card-header-bg: #D4943A;
    --card-header-text: #fff;
    --text-main: #3D2B1F;
    --text-light: #7A5C4F;
    --border-color: #E8D5C4;
    --shadow: 0 4px 20px rgba(61, 43, 31, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lora', serif;
    background-color: var(--content-bg);
    color: var(--text-main);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .site-header {
    background-color: var(--header-bg);
    text-align: center;
    padding: 30px 20px 25px;
  }

  .om-icon {
    width: 50px;
    height: 50px;
    background: #6B3FA0;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    font-size: 28px;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .site-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .site-header .subtitle {
    font-family: 'Lora', serif;
    font-style: italic;
    color: rgba(255,255,255,0.9);
    font-size: 1rem;
  }

  /* NAV BAR */
  .nav-bar {
    background-color: var(--nav-bg);
    padding: 14px 20px;
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--nav-btn-border) var(--nav-bg);
  }

  .nav-bar::-webkit-scrollbar { height: 4px; }
  .nav-bar::-webkit-scrollbar-track { background: var(--nav-bg); }
  .nav-bar::-webkit-scrollbar-thumb { background: var(--nav-btn-border); border-radius: 4px; }

  .nav-btn {
    font-family: 'Lora', serif;
    font-size: 0.85rem;
    padding: 7px 18px;
    border: 1.5px solid var(--nav-btn-border);
    background: transparent;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--nav-btn-text);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nav-btn:hover {
    background: var(--nav-btn-hover-bg);
    color: var(--nav-btn-hover-text);
  }

  .nav-btn.active {
    background: var(--nav-btn-hover-bg);
    color: var(--nav-btn-hover-text);
  }

  /* MAIN CONTENT */
  .main-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  /* SEARCH */
  .search-box {
    width: 100%;
    padding: 12px 18px;
    font-family: 'Lora', serif;
    font-size: 1rem;
    border: 1.5px solid var(--border-color);
    border-radius: 8px;
    background: #fff;
    outline: none;
    margin-bottom: 25px;
    transition: border-color 0.3s;
    color: var(--text-main);
  }

  .search-box:focus { border-color: var(--nav-btn-border); }

  /* BHAJAN LIST */
  .bhajan-list { display: flex; flex-direction: column; gap: 20px; }

  .bhajan-card {
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: #fff;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .bhajan-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(61, 43, 31, 0.15);
  }

  .bhajan-card-header {
    background: linear-gradient(135deg, #D4943A, #E8A84C);
    padding: 16px 22px;
    color: var(--card-header-text);
  }

  .bhajan-card-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .bhajan-card-header .deity-tag {
    font-size: 0.78rem;
    font-style: italic;
    opacity: 0.85;
    margin-top: 2px;
  }

  .bhajan-card-body {
    padding: 18px 22px;
    font-size: 0.95rem;
    color: var(--text-light);
    line-height: 1.7;
    max-height: 80px;
    overflow: hidden;
    position: relative;
  }

  .bhajan-card-body::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(transparent, #fff);
  }

  /* DETAIL VIEW */
  .detail-view { display: none; }
  .detail-view.active { display: block; }
  .list-view.hidden { display: none; }

  .back-btn {
    font-family: 'Lora', serif;
    font-size: 0.9rem;
    background: none;
    border: 1.5px solid var(--nav-btn-border);
    color: var(--nav-btn-border);
    cursor: pointer;
    margin-bottom: 25px;
    padding: 8px 20px;
    border-radius: 25px;
    transition: all 0.3s;
  }

  .back-btn:hover {
    background: var(--nav-btn-border);
    color: var(--nav-btn-hover-text);
  }

  .detail-header {
    background: linear-gradient(135deg, #D4943A, #E8A84C);
    padding: 25px 30px;
    border-radius: 10px 10px 0 0;
    color: #fff;
  }

  .detail-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    margin-bottom: 8px;
  }

  .detail-header .deity-badge {
    display: inline-block;
    padding: 3px 14px;
    border-radius: 15px;
    background: rgba(255,255,255,0.25);
    font-size: 0.8rem;
    font-style: italic;
  }

  .lyrics-container {
    background: #fff;
    padding: 30px;
    border-radius: 0 0 10px 10px;
    box-shadow: var(--shadow);
    font-size: 1.1rem;
    line-height: 1.9;
    text-align: center;
    color: var(--text-main);
  }

  .lyrics-container p { margin-bottom: 22px; }

  .no-results {
    text-align: center;
    color: var(--text-light);
    font-style: italic;
    padding: 40px 0;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.8rem;
    color: var(--text-light);
    font-style: italic;
  }

  @media (max-width: 600px) {
    .site-header h1 { font-size: 1.8rem; }
    .nav-btn { font-size: 0.78rem; padding: 6px 14px; }
    .lyrics-container { font-size: 1rem; text-align: left; padding: 20px; }
    .detail-header { padding: 20px; }
    .detail-header h2 { font-size: 1.3rem; }
  }
</style>
</head>

    { id: "govind-jai-jai", title: "Govind Jai Jai Gopal Jai Jai", deity: "Krishna", lyrics: `Govind jai jai, Gopal jai jai
Radha Raman hari Govind jai jai

Brahma ki jai jai, Vishnu ki jai jai
Uma Pati Shiv Shankar ki jai jai

Radha ki jai jai, Rukmini ki jai jai
Mor Mukut Bansi Wale ki jai jai` },
    { id: "hare-krishna-mahamantra", title: "Hare Krishna Maha Mantra", deity: "Krishna", lyrics: `Hare Krishna, Hare Krishna, Krishna Krishna, Hare Hare
Hare Rama, Hare Rama, Rama Rama, Hare Hare` },
    { id: "raadha-dhund-rahi", title: "Raadha Dhund Rahi", deity: "Krishna", lyrics: `Raadha Dhund Rahi, Kisine Mera Shaam Dekha
Shaam Dekha, Ghanshyaam Dekha

Radha Tera Shaam Hamne Mathura Mein Dekha
Bansi Bajaate Huye, Ho Raadha Tera Shaam Dekha

Raadha Tera Shaam Hamne Gokul Mein Dekha
Are Gaiyan Charaate Huye, Ho Raadha Tera Shaam Dekha

Raadha Tera Shaam Hamne Vrindavan Mein Dekha
Raas Rachaate Huye, Ho Raadha Tera Shaam Dekha` },
    { id: "radhe-radhe-sukhbir", title: "Radhe Radhe Radhe Radhe", deity: "Krishna", lyrics: `Vrindavan Me Dologe to Radhe Radhe Bologe
Rok Na Pavoge Khud Ko Tum Kahna Ke Hi Hologe

Aaoge Jo Vrindavan Mein, Duniya Bhul Jaoge 
Masti Mein Dube Hue, Phir Radhe Radhe Gaoge
Aate Jaate Sabse Jab Tum, Radhe Radhe Bologe
Radhe Radhe Kehte Kehte, Shyam Ke Hi Ho Loge

Hame Shyam Se Milade` },
    { id: "jai-jai-radha-raman", title: "Jai Jai Radha Raman Hari Bol", deity: "Krishna", lyrics: `Jai Jai Radha Raman Hari Bol
Hari Bol Hari Bol Hari Bol` }
  ];

  const state = { filter: 'All', search: '', activeBhajan: null };

  const listView = document.getElementById('listView');
  const detailView = document.getElementById('detailView');
  const bhajanList = document.getElementById('bhajanList');
  const searchInput = document.getElementById('searchInput');
  const navBar = document.getElementById('navBar');
  const backBtn = document.getElementById('backBtn');

  function renderList() {
    bhajanList.innerHTML = '';
    const filtered = bhajans.filter((b, index) => {
      const matchDeity = state.filter === 'All' || b.deity === state.filter;
      const matchSearch = b.title.toLowerCase().includes(state.search.toLowerCase()) || 
                          b.lyrics.toLowerCase().includes(state.search.toLowerCase());
      return matchDeity && matchSearch;
    });

    if (filtered.length === 0) {
      bhajanList.innerHTML = '<div class="no-results">No bhajans found matching your search.</div>';
      return;
    }

    filtered.forEach((b, i) => {
      const globalIndex = bhajans.indexOf(b) + 1;
      const card = document.createElement('div');
      card.className = 'bhajan-card';
      card.innerHTML = `
        <div class="bhajan-card-header">
          <h3>${globalIndex}. ${b.title.toUpperCase()}</h3>
          <span class="deity-tag">${b.deity === 'Krishna' ? 'Krishna & Radha' : b.deity}</span>
        </div>
        <div class="bhajan-card-body">${b.lyrics.replace(/\n/g, '<br>')}</div>
      `;
      card.addEventListener('click', () => openBhajan(b.id));
      bhajanList.appendChild(card);
    });
  }

  function openBhajan(id) {
    const b = bhajans.find(x => x.id === id);
    if (!b) return;
    state.activeBhajan = id;
    window.location.hash = id;
    
    const globalIndex = bhajans.indexOf(b) + 1;
    document.getElementById('detailTitle').textContent = `${globalIndex}. ${b.title.toUpperCase()}`;
    const badge = document.getElementById('detailDeity');
    badge.textContent = b.deity === 'Krishna' ? 'Krishna & Radha' : b.deity;
    
    const formattedLyrics = b.lyrics.split('\n\n').map(stanza => `<p>${stanza.replace(/\n/g, '<br>')}</p>`).join('');
    document.getElementById('detailLyrics').innerHTML = formattedLyrics;
    
    listView.classList.add('hidden');
    detailView.classList.add('active');
    window.scrollTo(0, 0);
  }

  function closeBhajan() {
    state.activeBhajan = null;
    window.location.hash = '';
    listView.classList.remove('hidden');
    detailView.classList.remove('active');
  }

  searchInput.addEventListener('input', (e) => { state.search = e.target.value; renderList(); });
  
  navBar.addEventListener('click', (e) => {
    if (e.target.classList.contains('nav-btn')) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      state.filter = e.target.getAttribute('data-deity');
      renderList();
    }
  });

  backBtn.addEventListener('click', closeBhajan);

  function handleHash() {
    const hash = window.location.hash.replace('#', '');
    if (hash && bhajans.find(b => b.id === hash)) openBhajan(hash);
    else closeBhajan();
  }

  window.addEventListener('hashchange', handleHash);
  renderList();
  handleHash();
</script>
</body>
</html>
